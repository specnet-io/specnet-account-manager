# Every merge to main: test again, then release the next patch version of VERSION (MAJOR.MINOR) as
# a git tag + GitHub release and push ghcr.io/<owner>/specnet-account-manager. See README.md "Versioning and releases".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag + release
  packages: write # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4" # keep in step with the Containerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Integration tests
        run: bash test/integration.sh

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR, got '$base'"; exit 1
          fi
          last="$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
          next="v${base}.$(( ${last:--1} + 1 ))"
          echo "Releasing $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes="$(mktemp)"
          {
            echo "Container image:"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "# digest: ${DIGEST}"
            echo '```'
          } > "$notes"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes" --generate-notes
