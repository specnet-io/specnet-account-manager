{{define "content"}}
<section class="card narrow">
  <h1>Change password</h1>
  <form method="post" action="/password" class="stack">
    {{template "csrf" .CSRF}}
    <input type="text" name="username" value="{{.Session.Username}}" autocomplete="username" hidden>
    <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
    <label>New password <input type="password" name="password" required minlength="{{.Data.MinLength}}" autocomplete="new-password"></label>
    <label>Repeat new password <input type="password" name="confirm" required minlength="{{.Data.MinLength}}" autocomplete="new-password"></label>
    <button class="primary">Change password</button>
  </form>
  <p class="muted small">Forgot your current password? <a href="/forgot-password">Get a reset link</a>.</p>
</section>
{{end}}
